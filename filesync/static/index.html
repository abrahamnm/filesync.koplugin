    window.detailRename = function() {
        if (!currentDetailEntry) return;
        var entry = currentDetailEntry;
        var fullName = entry.name;
        var dotIndex = fullName.lastIndexOf('.');
        var namePart = dotIndex > 0 ? fullName.substring(0, dotIndex) : fullName;
        var extPart = dotIndex > 0 ? fullName.substring(dotIndex) : '';

        // Show the modal with extension suffix
        var overlay = document.getElementById('modalOverlay');
        var titleElem = document.getElementById('modalTitle');
        var inputElem = document.getElementById('modalInput');
        var confirmBtn = document.getElementById('modalConfirm');

        titleElem.textContent = t('Rename');
        confirmBtn.textContent = t('Rename');

        // Wrap input with extension suffix
        var inputParent = inputElem.parentNode;
        var hasExtWrapper = inputParent.classList.contains('modal-input-with-ext');
        if (extPart) {
            if (!hasExtWrapper) {
                var wrapper = document.createElement('div');
                wrapper.className = 'modal-input-with-ext';
                inputParent.insertBefore(wrapper, inputElem);
                wrapper.appendChild(inputElem);
                var extSpan = document.createElement('span');
                extSpan.className = 'detail-ext-suffix';
                extSpan.id = 'modalExtSuffix';
                wrapper.appendChild(extSpan);
            }
            document.getElementById('modalExtSuffix').textContent = extPart;
        } else if (hasExtWrapper) {
            // Remove the wrapper if no extension
            var wrapper2 = inputParent;
            var grandParent = wrapper2.parentNode;
            grandParent.insertBefore(inputElem, wrapper2);
            wrapper2.remove();
        }

        inputElem.value = namePart;
        overlay.classList.add('open');
        setTimeout(function() {
            inputElem.focus();
            inputElem.select();
        }, 100);

        modalCallback = async function(newName) {
            if (!newName || (newName + extPart) === fullName) {
                restoreModalInput();
                return;
            }
            var finalName = newName + extPart;
            try {
                var parentPath = entry.path.substring(0, entry.path.lastIndexOf('/')) || '/';
                var newPath = parentPath + '/' + finalName;
                await api('POST', '/api/rename', { old_path: entry.path, new_path: newPath });
                showToast(t('Renamed successfully'), 'success');
                restoreModalInput();
                _hideDetailInternal();
                history.replaceState({path: currentPath}, '', '#' + encodeURI(currentPath));
                loadFiles();
            } catch (err) {
                showToast(t('Rename failed:') + ' ' + err.message, 'error');
                restoreModalInput();
            }
        };
    };

            t('Are you sure you want to delete') + ' "' + escapeHtml(entry.name) + '"?',

    // ===== Upload =====

    window.handleFileSelect = function(files) {

    async function uploadFile(file) {
        var container = document.getElementById('uploadProgress');
        var id = 'upload-' + Date.now() + '-' + Math.random().toString(36).substring(2, 8);
        var uploadTypeClass = getTypeClassFromFilename(file && file.name) || 'file';
        var uploadIcon = icons[uploadTypeClass] || icons.file;

        var item = document.createElement('div');
        item.className = 'upload-item';
        item.id = id;
        item.innerHTML = '<div class="upload-item-main">' +
            '<span class="upload-item-icon ' + uploadTypeClass + '" aria-hidden="true">' + uploadIcon + '</span>' +
            '<span class="upload-item-name">' + escapeHtml(file.name) + '</span>' +
            '</div>' +
            '<div class="progress-bar"><div class="progress-bar-fill" id="' + id + '-bar"></div></div>' +
            '<span class="upload-item-status" id="' + id + '-status">0%</span>';
        container.prepend(item);

        try {
            var formData = new FormData();
            formData.append('file', file);

            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/upload?path=' + encodeURIComponent(currentPath));

            xhr.upload.onprogress = function(e) {
                if (e.lengthComputable) {
                    var pct = Math.round((e.loaded / e.total) * 100);
                    var bar = document.getElementById(id + '-bar');
                    var status = document.getElementById(id + '-status');
                    if (bar) bar.style.width = pct + '%';
                    if (status) status.textContent = pct + '%';
                }
            };

            await new Promise(function(resolve, reject) {
                xhr.onload = function() {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        resolve();
                    } else {
                        try {
                            var d = JSON.parse(xhr.responseText);
                            reject(new Error(d.error || t('Upload failed:')));
                        } catch(e) {
                            reject(new Error(t('Upload failed:')));
                        }
                    }
                };
                xhr.onerror = function() { reject(new Error(t('Network error'))); };
                xhr.send(formData);
            });

            var bar = document.getElementById(id + '-bar');
            var status = document.getElementById(id + '-status');
            if (bar) { bar.style.width = '100%'; bar.classList.add('complete'); }
            if (status) { status.textContent = t('Done'); status.classList.add('success'); }
            showToast(file.name + ' ' + t('uploaded'), 'success');
            loadFiles();

            setTimeout(function() {
                var el = document.getElementById(id);
                if (el) el.remove();
            }, 3000);

        } catch (err) {
            var bar2 = document.getElementById(id + '-bar');
            var status2 = document.getElementById(id + '-status');
            if (bar2) { bar2.style.width = '100%'; bar2.classList.add('error'); }
            if (status2) { status2.textContent = t('Failed'); status2.classList.add('error'); }
            showToast(t('Upload failed:') + ' ' + err.message, 'error');
        }
    }

    // Drag and drop
    var dropzone = document.getElementById('dropzone');
    var dropContainer = document.getElementById('dropzoneContainer');

    document.addEventListener('dragover', function(e) {
        e.preventDefault();
        if (!uploadZoneVisible) {
            uploadZoneVisible = true;
            dropzone.classList.add('visible');
        }
        dropzone.classList.add('active');
    });

    document.addEventListener('dragleave', function(e) {
        if (e.relatedTarget === null || !document.contains(e.relatedTarget)) {
            dropzone.classList.remove('active');
        }
    });

    document.addEventListener('drop', function(e) {
        e.preventDefault();
        dropzone.classList.remove('active');
        if (e.dataTransfer.files.length > 0) {
            handleFileSelect(e.dataTransfer.files);
        }
    });
    // ===== History / popstate =====
    // Parse the current hash and return {path, detail} without modifying state
    function _parseHash() {
        var hash = window.location.hash;
        if (!hash || hash === '#' || hash === '#/') {
            return {path: '/', detail: false};
        }
        // Strip leading '#' and decode URL-encoded characters (spaces, parens, etc.)
        var raw;
        try { raw = decodeURIComponent(hash.substring(1)); } catch(e) { raw = hash.substring(1); }
        if (raw.endsWith('!detail')) {
            return {path: raw.substring(0, raw.length - 7), detail: true};
        }
        return {path: raw || '/', detail: false};
    }

    window.addEventListener('popstate', function() {
        var state = _parseHash();
        if (state.detail) {
            // If navigating to a detail view and we're already showing it, skip
            if (currentDetailEntry && currentDetailEntry.path === state.path) return;
            // We might need to navigate to the parent directory first to load entries
            var parentPath = state.path.substring(0, state.path.lastIndexOf('/')) || '/';
            if (currentPath !== parentPath) {
                // Need to load the directory first, then show detail once loaded
                currentPath = parentPath;
                currentFilter = '';
                document.getElementById('searchInput').value = '';
                var params = new URLSearchParams({
                    path: currentPath,
                    sort: currentSort,
                    order: currentOrder,
                    filter: currentFilter
                });
                api('GET', '/api/files?' + params).then(function(data) {
                    renderBreadcrumbs(data.breadcrumbs);
                    renderFiles(data.entries);
                    _showDetailInternal(state.path);
                }).catch(function() {
                    // If loading fails, just navigate to the directory
                    _navigateInternal(parentPath);
                });
            } else {
                _showDetailInternal(state.path);
            }
        } else {
            // Navigating to a directory — close detail if open
            if (currentDetailEntry) {
                _hideDetailInternal();
            }
            _navigateInternal(state.path);
        }
    });

    // ===== Init =====
    // Read hash to determine initial state before loading
    var initState = _parseHash();
    if (initState.detail) {
        // For detail view, start at the parent directory
        var initParent = initState.path.substring(0, initState.path.lastIndexOf('/')) || '/';
        currentPath = initParent;
    } else {
        currentPath = initState.path;
    }
    // Set the initial history entry (replaceState so we don't add an extra entry)
    history.replaceState(
        initState.detail ? {path: initState.path, detail: true} : {path: currentPath},
        '',
        window.location.hash || '#/'
    );

    // Fetch language setting from server, then apply translations and load files
    var _initDetailPath = initState.detail ? initState.path : null;
    // When the user lands on the bare URL (no hash deep-link), prefer KOReader's
    // configured home folder over filesystem root. Single attempt; on failure or
    // when home is unset/outside root, keep currentPath ("/") as the fallback.
    var _hasDeepLink = !!window.location.hash && window.location.hash !== '#' && window.location.hash !== '#/';
    var _homeFetch = (_hasDeepLink || _initDetailPath)
        ? Promise.resolve()
        : fetch('/api/home')
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data && typeof data.home === 'string' && data.home) {
                    currentPath = data.home;
                    history.replaceState({path: currentPath}, '', '#' + encodeURI(currentPath));
                }
            })
            .catch(function() { /* fall back silently */ });

    _homeFetch
        .then(function() { return fetch('/api/lang'); })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            if (data && data.lang) {
                // Try exact match first, then prefix match (e.g. "zh_CN" -> "zh")
                if (typeof TRANSLATIONS !== "undefined" && TRANSLATIONS[data.lang]) {
                    currentLang = data.lang;
                } else {
                    var prefix = data.lang.split('_')[0];
                    if (typeof TRANSLATIONS !== "undefined" && TRANSLATIONS[prefix]) {
                        currentLang = prefix;
                    }
                }
            }
        })
        .catch(function() {
            // Keep English as default
        })
        .then(function() {
            // Set document direction and language
            document.documentElement.setAttribute("lang", currentLang.replace("_", "-"));
            document.documentElement.setAttribute("dir", isRTLLanguage(currentLang) ? "rtl" : "ltr");
            initTheme();
            applyStaticTranslations();
            initEditor();
            return loadFiles();
        })
        .then(function() {
            // After files are loaded, open detail view if hash indicated one
            if (_initDetailPath) {
                _showDetailInternal(_initDetailPath);
            }
        });

})();
</script>
</body>
</html>
